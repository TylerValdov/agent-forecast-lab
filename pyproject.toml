[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-lab"
version = "0.1.0"
description = "A reproducible harness for testing whether LLM agent design techniques improve probabilistic forecasting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Exact pins: this is a research artifact, so runs must be reproducible.
dependencies = [
    "anthropic==2.12.0",
    "nba_api==1.12.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "pydantic==2.14.4",
    "PyYAML==6.0.4",
    "matplotlib==3.11.2",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[project.scripts]
forecast-lab = "forecast_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forecast_lab = ["agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits external APIs (deselect with -m 'not network')"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
